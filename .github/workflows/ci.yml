name: CI

on:
  push:
    branches: [dev, master, STL_2026_itu_submission]
  pull_request:
    branches: [dev, master]

jobs:
  build-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake .
      - name: Build
        run: cmake --build .
      - name: Test
        run: ctest --output-on-failure

  build-s390x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: s390x
          distro: ubuntu22.04
          install: |
            apt-get update -q -y
            apt-get install -y cmake gcc g++
          run: |
            cmake .
            cmake --build .
            ctest --output-on-failure
