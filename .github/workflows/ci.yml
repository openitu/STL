name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: ubuntu-latest
            compiler: gcc-32bit
            cc: gcc
            cxx: g++
            cflags: "-m32"
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    timeout-minutes: 15

    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Install 32-bit libraries
        if: matrix.cflags == '-m32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake . ${{ matrix.cflags && format('-DCMAKE_C_FLAGS={0} -DCMAKE_CXX_FLAGS={0}', matrix.cflags) }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          # Exclude build directory from Windows Defender to avoid scan delays
          powershell -Command "Add-MpPreference -ExclusionPath '${{ github.workspace }}'"
          cmake .

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build . --config Release

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --output-on-failure --build-config Release

  manual:
    runs-on: ubuntu-latest
    name: LaTeX manual
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build manual
        run: cd doc/manual && latexmk -pdf -halt-on-error STLmanual.tex < /dev/null

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: STL-manual
          path: doc/manual/STLmanual.pdf

  build-i386-container:
    runs-on: ubuntu-latest
    container: i386/ubuntu:22.04
    name: i386 container
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y gcc g++ cmake make git

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake .

      - name: Build
        run: cmake --build .

      - name: Test
        run: ctest --output-on-failure

  build-arm32-qemu:
    runs-on: ubuntu-latest
    name: arm32 (QEMU)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Build and test in ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src -w /src \
            arm32v7/ubuntu:22.04 bash -c "
              apt-get update && apt-get install -y gcc g++ cmake make &&
              cmake . &&
              cmake --build . &&
              ctest --output-on-failure
            "
