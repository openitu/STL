name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    timeout-minutes: 15

    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake .
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          # Exclude build directory from Windows Defender to avoid scan delays
          powershell -Command "Add-MpPreference -ExclusionPath '${{ github.workspace }}'"
          cmake .

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build . --config Release

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --output-on-failure --build-config Release

  manual:
    runs-on: ubuntu-latest
    name: LaTeX manual
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build manual
        run: cd doc/manual && latexmk -pdf -halt-on-error STLmanual.tex < /dev/null
